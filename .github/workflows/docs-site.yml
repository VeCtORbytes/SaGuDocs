# Builds the Next.js static export and deploys it to GitHub Pages.
# Requires: Settings → Pages → Source = "GitHub Actions".
name: Deploy docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Project Pages are served from /<repo>/. Remove for a custom domain.
          NEXT_PUBLIC_BASE_PATH: /SaGuDocs
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages_status
        env:
          REPO: ${{ github.repository }}
        run: |
          status="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages")"

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for $REPO. Skipping deploy."
            exit 0
          fi

          echo "Unexpected response while checking Pages status: HTTP $status"
          cat /tmp/pages.json
          exit 1

      - id: deployment
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
